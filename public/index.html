<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detail Job Drive Manager</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/favicon.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="workspace">
        <datalist id="jobSuggestions"></datalist>
        <div class="topbar">
          <div class="brand-lockup">
            <img class="brand-logo logo-light" src="/assets/logo-light.png" alt="Jazz's Detailing" />
            <img class="brand-logo logo-dark" src="/assets/logo-dark.png" alt="Jazz's Detailing" />
            <div>
              <p class="eyebrow">Jazz's Detailing</p>
              <h1>Detail job folders and invoices</h1>
            </div>
          </div>
          <div class="auth-actions">
            <button class="theme-toggle" id="themeToggle" type="button">Dark</button>
            <a class="button" id="connectLink" href="/auth/google">Connect Drive</a>
            <form action="/logout" method="post">
              <button class="icon-button" type="submit" title="Sign out" aria-label="Sign out">
                &#x21AA;
              </button>
            </form>
          </div>
        </div>

        <nav class="tabs" aria-label="Job tools">
          <button class="tab active" type="button" data-tab="photosPanel">Photos</button>
          <button class="tab" type="button" data-tab="invoicePanel">Invoice</button>
        </nav>

        <section id="photosPanel" class="tool-panel active">
          <form id="uploadForm" class="panel">
            <label for="folderName">Vehicle or job name</label>
            <input
              id="folderName"
              name="folderName"
              type="text"
              placeholder="(enter vehicle)"
              list="jobSuggestions"
              autocomplete="off"
              required
            />
            <label for="photoLicensePlate">License plate</label>
            <input
              id="photoLicensePlate"
              name="licensePlate"
              type="text"
              placeholder="ABC1234"
              autocomplete="off"
              required
            />

            <label class="dropzone" for="photos">
              <input id="photos" name="photos" type="file" accept="image/*" multiple required />
              <span class="drop-title">Choose photos</span>
              <span id="fileSummary">Select all the images for this detail job.</span>
            </label>

            <div class="photo-preview-grid" id="photoPreviewGrid" aria-live="polite"></div>

            <button class="primary" id="uploadButton" type="submit">Upload to Drive</button>
          </form>

          <section class="result" id="photoResult" hidden></section>
        </section>

        <section id="invoicePanel" class="tool-panel">
          <form id="invoiceForm" class="panel invoice-form">
            <div class="grid two">
              <div>
                <label for="invoiceFolderName">Vehicle or job name</label>
                <input
                  id="invoiceFolderName"
                  name="folderName"
                  type="text"
                  placeholder="(enter vehicle)"
                  list="jobSuggestions"
                  autocomplete="off"
                  required
                />
              </div>
              <div>
                <label for="licensePlate">License plate</label>
                <input id="licensePlate" name="licensePlate" type="text" placeholder="ABC1234" autocomplete="off" required />
              </div>
            </div>

            <div class="grid two">
              <div>
                <label for="customerName">Customer name</label>
                <input id="customerName" name="customerName" type="text" required />
              </div>
              <div>
                <label for="customerEmail">Customer email</label>
                <input id="customerEmail" name="customerEmail" type="email" required />
              </div>
            </div>

            <div class="grid two">
              <div>
                <label for="copyEmail">Copy email</label>
                <input id="copyEmail" name="copyEmail" type="email" required />
              </div>
              <div>
                <label for="invoiceNumber">Next invoice number</label>
                <input id="invoiceNumber" name="invoiceNumber" type="text" value="jd-100" readonly />
              </div>
            </div>

            <div class="grid three">
              <div>
                <label for="invoiceOffset">Reset invoice offset</label>
                <input id="invoiceOffset" type="number" min="0" step="1" placeholder="0" />
              </div>
              <div>
                <label for="invoiceDate">Invoice date</label>
                <input id="invoiceDate" name="invoiceDate" type="date" required />
              </div>
              <div>
                <label for="dueDate">Due date</label>
                <input id="dueDate" name="dueDate" type="date" />
              </div>
            </div>
            <div class="form-actions">
              <button class="secondary" id="resetInvoiceButton" type="button">Reset invoice number</button>
              <button class="secondary danger-secondary" id="clearInvoiceButton" type="button">Clear invoice form</button>
            </div>

            <div class="line-items">
              <div class="line-head">
                <span>Service</span>
                <span>Qty</span>
                <span>Rate</span>
                <span></span>
              </div>
              <div id="invoiceItems"></div>
              <button class="secondary" id="addItemButton" type="button">Add service</button>
            </div>

            <div class="grid three">
              <div>
                <label for="discountType">Discount type</label>
                <select id="discountType" name="discountType">
                  <option value="amount">$ amount</option>
                  <option value="percent">% percent</option>
                </select>
              </div>
              <div>
                <label for="discount">Discount value</label>
                <input id="discount" name="discount" type="number" min="0" step="0.01" value="0" />
              </div>
              <div>
                <label for="taxRate">Tax rate %</label>
                <input id="taxRate" name="taxRate" type="number" min="0" step="0.01" value="0" />
              </div>
            </div>

            <label for="notes">Notes</label>
            <textarea id="notes" name="notes" rows="4" placeholder="Payment terms, thank-you note, or warranty note"></textarea>

            <label for="emailMessage">Email message</label>
            <textarea id="emailMessage" name="emailMessage" rows="5"></textarea>

            <div class="invoice-total">
              <span>Total</span>
              <strong id="invoiceTotal">$0.00</strong>
            </div>

            <button class="primary" id="invoiceButton" type="submit">Create and email invoice</button>
          </form>

          <section class="result" id="invoiceResult" hidden></section>
          <section class="history-panel" id="jobHistory" hidden>
            <h2>Previous invoices</h2>
            <div id="jobHistoryList"></div>
          </section>
        </section>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
